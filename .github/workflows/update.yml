name: Update XML Feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-xml-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate XML and Logs
        run: |
          python generate_feed.py

      # ⬇️ НОВЫЙ ШАГ: фид HardSmoke (feed.xml)
      # Зависимостей не требует, читает таблицу «Товари для Gmall» по ссылке.
      - name: Generate HardSmoke feed
        env:
          SPREADSHEET_ID: ${{ secrets.GMALL_SPREADSHEET_ID }}
        run: |
          python generate_hardsmoke_feed.py

      # if: always() — если предохранитель в HardSmoke-скрипте сработает и шаг
      # упадёт, остальные фиды всё равно закоммитятся, а ошибка останется видна.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.xml *.txt
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "Update XML feeds"
          git pull --rebase origin main
          git push origin main
